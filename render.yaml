# Render Blueprint: New → Blueprint → pick this repo. Fill in the secret values when asked.
services:
  - type: web
    name: bug-whisperer
    runtime: docker
    plan: standard          # 2 GB RAM: Chrome + Kane CLI + Claude Code + two small web apps
    healthCheckPath: /inbox
    envVars:
      - key: WHISPERER_HOSTED
        value: "1"
      - key: DEMO_DAILY_LIMIT
        value: "20"
      - key: DEMO_PASSCODE          # give it to the judges in the submission
        sync: false
      - key: LT_USERNAME            # TestMu AI: Account Settings → Password & Security
        sync: false
      - key: LT_ACCESS_KEY
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN  # from `claude setup-token` (or set ANTHROPIC_API_KEY instead)
        sync: false
