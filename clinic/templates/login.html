{% extends "base.html" %}
{% block title %}Log in · Clinic Records{% endblock %}
{% block main_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">+</span> Clinic Records</div>
  <h1>Log in</h1>
  <p class="muted">Sign in to your clinic account.</p>

  {% if error %}<div class="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/login" class="form">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="auth-switch">New clinic? <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
