<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic Records{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if clinic %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/patients"><span class="brand-mark">+</span> Clinic Records</a>
      <nav class="nav">
        <a href="/patients" class="{{ 'active' if active == 'patients' }}">Patients</a>
        <a href="/appointments" class="{{ 'active' if active == 'appointments' }}">Appointments</a>
      </nav>
      <div class="account">
        <span class="clinic-name">{{ clinic.name }}</span>
        <form method="post" action="/logout">
          <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
        </form>
      </div>
    </div>
  </header>
  {% endif %}

  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
